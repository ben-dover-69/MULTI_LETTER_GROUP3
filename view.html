<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>View Letter</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Poppins&family=Quicksand&family=Pacifico&family=Comic+Neue&family=Roboto&family=Lobster&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family:'Quicksand', sans-serif;
  background:#f5f5f5;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  transition:0.3s;
}

.container {
  max-width:800px;
  width:90%;
  background:#fff;
  padding:25px;
  border-radius:15px;
  box-shadow:0 8px 20px rgba(0,0,0,0.2);
}

h1 {
  text-align:center;
  margin-bottom:10px;
}

.letter-content {
  padding:15px;
  border-radius:10px;
  transition:0.3s;
  line-height:1.5;
}

.date {
  font-style:italic;
  margin-bottom:15px;
  text-align:right;
  font-size:14px;
  color:#333;
}
</style>
</head>

<body>
<div class="container">
  <h1 id="letterTitle">Your Letter</h1>
  <div class="date" id="letterDate">Date: --</div>
  <div class="letter-content" id="letterContent">
    Loading letter...
  </div>
</div>

<script>
// Get query param
function getQueryParam(param){
  const urlParams = new URLSearchParams(window.location.search);
  return urlParams.get(param);
}

const letterEncoded = getQueryParam("letter");

if(letterEncoded){
  try{
    const letterData = JSON.parse(atob(letterEncoded));
    const contentDiv = document.getElementById("letterContent");

    // Apply sender styles
    contentDiv.style.fontFamily = letterData.font || 'Quicksand';
    contentDiv.style.color = letterData.color || '#000';
    contentDiv.style.fontSize = (letterData.size || 16) + "px";

    // Apply background based on letter type
    const typeColors = {
      "Love Letter":"#8B0000",
      "Formal Letter":"#2F4F4F",
      "Informal Letter":"#FFD700",
      "Birthday Letter":"#FF1493",
      "Invitation Letter":"#663399"
    };
    document.body.style.background = typeColors[letterData.letter_type] || "#f5f5f5";

    // Set title and content
    document.getElementById("letterTitle").innerText = letterData.letter_type || "Your Letter";
    document.getElementById("letterDate").innerText = "Date: " + (letterData.date || new Date().toLocaleDateString());

    contentDiv.innerHTML = `
      <p><strong>To:</strong> ${letterData.recipient_name}</p>
      <p>${letterData.message_body}</p>
      <p><strong>Sincerely,</strong> ${letterData.sender_name || "Anonymous"}</p>
    `;

  }catch(e){
    document.getElementById("letterContent").innerText = "Failed to load letter.";
    console.error(e);
  }
}else{
  document.getElementById("letterContent").innerText = "No letter data found.";
}
</script>

</body>
</html>
