<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>View Letter</title>

<!-- Google Fonts (same as index.html for consistency) -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Poppins:wght@300;500;700&family=Pacifico&family=Quicksand:wght@400;600&family=Comic+Neue:wght@300;700&family=Nunito:wght@300;600&family=Montserrat:wght@400;700&family=Dancing+Script:wght@400;700&family=Abril+Fatface&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Quicksand', sans-serif;
  transition: 0.4s;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  background-color: #800020;
}

.postcard {
  width: 90%;
  max-width: 900px;
  background-color: #f7f7f7;
  padding: 30px;
  border-radius: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

h1 { text-align:center; margin-bottom:20px; }

p { line-height:1.6em; font-size:1.1em; }

</style>
</head>

<body>
  <div class="postcard" id="letterBox">
    <h1 id="title">Letter</h1>
    <p>Date: <span id="date">—</span></p>
    <p>Dear <span id="recipient">—</span>,</p>
    <p id="message">—</p>
    <p>Sincerely,</p>
    <p id="sender">—</p>
  </div>

<script>
// ===== GET DATA FROM URL =====
function getLetterData() {
  const params = new URLSearchParams(window.location.search);
  const data = params.get('data');
  if(!data) return null;
  try {
    return JSON.parse(atob(data));
  } catch {
    return null;
  }
}

const letterData = getLetterData();
const letterBox = document.getElementById("letterBox");

if(letterData){
  document.getElementById("title").innerText = letterData.title;
  document.getElementById("recipient").innerText = letterData.recipient;
  document.getElementById("sender").innerText = letterData.sender;
  document.getElementById("message").innerText = letterData.message;
  document.getElementById("date").innerText = letterData.date;

  // APPLY DESIGN
  letterBox.style.fontFamily = letterData.font;
  letterBox.style.color = letterData.color;
  letterBox.style.fontSize = letterData.size;
  document.body.className = letterData.type; // body background class
} else {
  letterBox.innerHTML = "<h1>Letter not found</h1><p>Sorry, the letter data is missing or invalid.</p>";
}
</script>

</body>
</html>
